name: Check and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_eel2.py
      - run: python scripts/benchmark_eel2.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.9'
        with:
          name: eel2-server
          path: dist/*.pyz
          if-no-files-found: error
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .grammar-tools --no-audit --no-fund tree-sitter-cli@0.25.10
      - name: Check generated parser
        working-directory: grammar
        run: |
          ../.grammar-tools/node_modules/.bin/tree-sitter generate --abi 14
          git diff --exit-code -- src
      - run: python3 scripts/check_eel2_grammar.py --cli "$GITHUB_WORKSPACE/.grammar-tools/node_modules/.bin/tree-sitter"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target wasm32-wasip2
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable build --locked --release --target wasm32-wasip2
      - uses: actions/upload-artifact@v4
        with:
          name: eel2-extension-wasm
          path: target/wasm32-wasip2/release/mtt_eel2_zed.wasm
          if-no-files-found: error
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            executable: .compiler-build/eel2-check
          - os: macos-14
            platform: macos-arm64
            executable: .compiler-build/eel2-check
          - os: macos-15-intel
            platform: macos-x86_64
            executable: .compiler-build/eel2-check
          - os: windows-latest
            platform: windows-x86_64
            executable: .compiler-build/Release/eel2-check.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: cmake -S compiler -B .compiler-build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build .compiler-build --config Release --parallel 4
      - name: Test native compiler integration
        shell: bash
        env:
          EEL2_TEST_CHECKER: ${{ github.workspace }}/${{ matrix.executable }}
        run: python -m unittest discover -s tests -p test_eel2_editing.py -v
      - name: Package checker and licenses
        run: python scripts/package_eel2_checker.py --binary "${{ matrix.executable }}" --ysfx .compiler-build/_deps/ysfx-src --output "compiler-artifact/eel2-check-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: eel2-check-${{ matrix.platform }}
          path: compiler-artifact/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, grammar, build, compiler]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eel2-server
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: eel2-extension-wasm
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: eel2-check-*
          path: release
          merge-multiple: true
      - name: Write compiler checksums
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib
          root = pathlib.Path('release')
          files = sorted(root.glob('eel2-check-*.zip'))
          assert len(files) == 4
          (root / 'compiler-SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PYTHON
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path('extension.toml').read_text())
          version = manifest['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and manifest version differ'
          assert pathlib.Path('release/eel2-lsp-v' + version + '.pyz').is_file()
          PY
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "EEL2 / JSFX $RELEASE_TAG" --notes-file RELEASE_NOTES.md
